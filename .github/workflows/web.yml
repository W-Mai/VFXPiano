name: Web
permissions:
  contents: write

# Build the frontend-only web app (fullscreen piano + bottom bar) with Vite and
# deploy it to the gh-pages branch. Re-runs on push to main and after each
# Release so the page always reflects the latest.
on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  web:
    name: Build and deploy web landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vite build --config vite.web.config.ts
      - uses: JamesIves/github-pages-deploy-action@v4.4.1
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          branch: gh-pages
          folder: dist-web
          token: ${{ secrets.GITHUB_TOKEN }}
          single-commit: true
